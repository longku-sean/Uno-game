<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO 好友連線派對</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172235;color:white;font-family:Arial,"Noto Sans TC",sans-serif}
header{text-align:center;padding:20px;background:#101722;font-size:26px;font-weight:bold}
header span{background:#e73535;padding:5px 12px;border-radius:8px}
main{max-width:850px;margin:auto;padding:16px}.panel{background:#ffffff12;border:1px solid #ffffff30;border-radius:18px;padding:18px;margin-bottom:14px}
input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:0;font-size:16px}
button{border:0;border-radius:10px;padding:13px 16px;font-weight:bold;font-size:15px;margin:4px;cursor:pointer}
button:disabled{opacity:.4}.primary{background:#ffd83d;color:#222}.secondary{background:#e8edf5;color:#222}
.hidden{display:none!important}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.player{background:#ffffff20;padding:12px;border-radius:12px;text-align:center}.active{outline:3px solid #ffdf40}
.table{background:#087346;border:7px solid #96613b;border-radius:45px;min-height:160px;display:flex;align-items:center;justify-content:center;gap:30px;margin:15px 0}
.card{width:60px;height:88px;border:4px solid white;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:bold;box-shadow:0 3px 8px #0008;cursor:pointer;color:white;flex-shrink:0}
.red{background:#e73535}.blue{background:#2878e8}.green{background:#20a765}.yellow{background:#f4c62f;color:#222}
.wild{background:conic-gradient(#e73535 0 25%,#2878e8 0 50%,#f4c62f 0 75%,#20a765 0)}
.hand{display:flex;overflow-x:auto;gap:7px;padding:12px 0}.hand .card{width:54px;height:80px;font-size:19px}
.status{text-align:center;background:#101722;padding:14px;border-radius:12px}#msg{color:#ffe36b;min-height:24px;white-space:pre-wrap}
@media(max-width:550px){.players{grid-template-columns:repeat(2,1fr)}main{padding:10px}}
</style></head>
<body>
<header><span>UNO</span> 好友連線派對</header><main>
<section id="lobby" class="panel"><h2>一起玩 UNO！</h2>
<input id="name" maxlength="12" placeholder="輸入你的暱稱">
<button class="primary" id="create">建立房間</button><hr>
<input id="code" maxlength="5" placeholder="輸入五位房間代碼">
<button class="secondary" id="join">加入房間</button><p id="msg"></p></section>
<section id="waiting" class="panel hidden"><h2>等待玩家加入</h2><h1 id="roomCode"></h1>
<div id="waitingPlayers" class="players"></div><p id="waitMsg"></p>
<button class="primary" id="start" disabled>開始遊戲</button><button id="leave">離開房間</button></section>
<section id="game" class="hidden"><div class="panel">房間：<b id="gameCode"></b><p id="turn"></p><div id="players" class="players"></div></div>
<div class="table"><div><div class="card blue">UNO</div><small>牌庫</small></div><div><div id="topCard" class="card red">?</div><small>目前牌</small></div></div>
<div class="panel"><h3>你的手牌</h3><div id="hand" class="hand"></div><div id="status" class="status"></div>
<button class="primary" id="draw">摸一張</button><button class="secondary" id="uno">喊 UNO！</button><p id="gameMsg"></p></div></section></main>
<div id="colorBox" class="panel hidden" style="position:fixed;top:35%;left:5%;width:90%;background:#172235;text-align:center;z-index:5">
<h3>選擇顏色</h3><button class="red" data-color="red">紅</button><button class="blue" data-color="blue">藍</button><button class="green" data-color="green">綠</button><button class="yellow" data-color="yellow">黃</button></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getDatabase,ref,get,set,onValue,runTransaction}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
const config={apiKey:"AIzaSyDo6pTESO366fRTUfpdjF_afGox-ywo-tM",authDomain:"uno-game-5a743.firebaseapp.com",databaseURL:"https://uno-game-5a743-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"uno-game-5a743",storageBucket:"uno-game-5a743.firebasestorage.app",messagingSenderId:"573981894102",appId:"1:573981894102:web:bfdde59040daa88cdf7077"};
const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);
let uid="",room="",data=null,stop=null,pending=null;
const colors=["red","blue","green","yellow"],roomRef=()=>ref(db,"rooms/"+room),playerName=()=>($("name").value.trim()||"玩家").slice(0,12);
async function login(){if(!auth.currentUser){const x=await signInAnonymously(auth);uid=x.user.uid}else uid=auth.currentUser.uid}
function err(e){console.error(e);$("msg").textContent="錯誤："+(e.code?e.code+"：":"")+(e.message||e)}
function deckMake(){let d=[];for(const c of colors){d.push({id:c+"0",color:c,value:"0"});for(let n=1;n<=9;n++)for(let k=0;k<2;k++)d.push({id:c+n+k,color:c,value:String(n)});for(const v of["skip","reverse","+2"])for(let k=0;k<2;k++)d.push({id:c+v+k,color:c,value:v})}for(let k=0;k<4;k++){d.push({id:"w"+k,color:"wild",value:"wild"},{id:"f"+k,color:"wild",value:"+4"})}return d.sort(()=>Math.random()-.5)}
function label(v){return({skip:"跳過",reverse:"反轉",wild:"變色","+2":"+2","+4":"+4"})[v]||v}
function next(g,n=1){g.index=(g.index+g.direction*n+g.order.length*10)%g.order.length}
function drawCards(g,id,n){for(let i=0;i<n;i++){if(!g.deck.length){if(g.discard.length<=1)break;const t=g.discard.pop();g.deck=g.discard.sort(()=>Math.random()-.5);g.discard=[t]}if(g.deck.length)g.hands[id].push(g.deck.pop())}}
async function create(){try{$("msg").textContent="正在建立房間...";await login();let code="";for(let i=0;i<12;i++){const c=Math.random().toString(36).slice(2,7).toUpperCase();if(!(await get(ref(db,"rooms/"+c))).exists()){code=c;break}}if(!code)throw Error("無法產生房間代碼");room=code;await set(roomRef(),{host:uid,players:{[uid]:{name:playerName()}},game:null});enter()}catch(e){err(e)}}
async function join(){try{$("msg").textContent="正在加入...";await login();room=$("code").value.trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(room))throw Error("請輸入五位房間代碼");const s=await get(roomRef());if(!s.exists())throw Error("找不到房間，請確認代碼");const r=s.val();if(r.game)throw Error("遊戲已開始");const ps=r.players||{};if(!ps[uid]&&Object.keys(ps).length>=4)throw Error("房間已滿");await set(ref(db,"rooms/"+room+"/players/"+uid),{name:playerName()});if(!(await get(ref(db,"rooms/"+room+"/players/"+uid))).exists())throw Error("玩家資料寫入失敗，請檢查資料庫權限");enter()}catch(e){err(e)}}
function enter(){$("lobby").classList.add("hidden");$("waiting").classList.remove("hidden");$("roomCode").textContent=room;$("gameCode").textContent=room;if(stop)stop();stop=onValue(roomRef(),s=>{data=s.val();if(!data){$("waitMsg").textContent="房間不存在";return}if(data.game){$("waiting").classList.add("hidden");$("game").classList.remove("hidden");render()}else renderWaiting()},err)}
function renderWaiting(){const box=$("waitingPlayers");box.innerHTML="";const ids=Object.keys(data.players||{});ids.forEach(id=>{const p=document.createElement("div");p.className="player";p.textContent=(data.players[id].name||"玩家")+(id===data.host?" 👑":"");box.append(p)});$("waitMsg").textContent=ids.length+" / 4 人";$("start").disabled=uid!==data.host||ids.length<2}
async function start(){try{await runTransaction(roomRef(),r=>{if(!r||r.host!==uid||r.game||Object.keys(r.players||{}).length<2)return;const order=Object.keys(r.players),deck=deckMake(),hands={};order.forEach(id=>hands[id]=deck.splice(0,7));let first=deck.pop();while(first.color==="wild"){deck.unshift(first);first=deck.pop()}const uno={};order.forEach(id=>uno[id]=false);r.game={order,hands,deck,discard:[first],index:0,direction:1,color:first.color,winner:null,uno,last:"遊戲開始！"};return r})}catch(e){$("waitMsg").textContent="開始失敗："+e.message}}
function render(){const g=data.game;if(!g)return;const current=g.order[g.index];$("turn").textContent="輪到："+(data.players[current]?.name||"玩家");const box=$("players");box.innerHTML="";g.order.forEach(id=>{const p=document.createElement("div");p.className="player"+(id===current?" active":"");p.textContent=(data.players[id]?.name||"玩家")+"："+(g.hands[id]?.length||0)+" 張";box.append(p)});const top=g.discard[g.discard.length-1];$("topCard").className="card "+(top.color==="wild"?"wild":top.color);$("topCard").textContent=label(top.value);$("hand").innerHTML="";(g.hands[uid]||[]).forEach(c=>{const el=document.createElement("div");el.className="card "+(c.color==="wild"?"wild":c.color);el.textContent=label(c.value);el.onclick=()=>play(c.id);$("hand").append(el)});const mine=current===uid&&!g.winner;$("status").textContent=g.winner?(data.players[g.winner]?.name||"玩家")+" 獲勝！":mine?"輪到你了！":"等待其他玩家出牌";$("draw").disabled=!mine;$("uno").disabled=(g.hands[uid]||[]).length!==1||!!g.winner;$("gameMsg").textContent=g.last||""}
async function play(id){const g=data?.game;if(!g||g.order[g.index]!==uid||g.winner)return;const c=g.hands[uid].find(x=>x.id===id);if(!c)return;const top=g.discard[g.discard.length-1];if(c.color!=="wild"&&c.color!==g.color&&c.value!==top.value){$("gameMsg").textContent="顏色或數字必須符合！";return}if(c.color==="wild"){pending=c;$("colorBox").classList.remove("hidden");return}await commit(c,null)}
async function commit(card,color){try{await runTransaction(roomRef(),r=>{const g=r?.game;if(!g||g.order[g.index]!==uid||g.winner)return;const h=g.hands?.[uid];if(!h)return;const i=h.findIndex(c=>c.id===card.id);if(i<0)return;const top=g.discard[g.discard.length-1];if(card.color!=="wild"&&card.color!==g.color&&card.value!==top.value)return;g.uno=g.uno||{};for(const id of g.order)if(typeof g.uno[id]!=="boolean")g.uno[id]=false;h.splice(i,1);g.discard.push(card);g.color=color||card.color;g.uno[uid]=false;if(!h.length){g.winner=uid;g.last=(r.players[uid]?.name||"玩家")+" 獲勝！";return r}let steps=1;if(card.value==="reverse"){g.direction*=-1;if(g.order.length===2)steps=2}if(card.value==="skip")steps=2;if(card.value==="+2"||card.value==="+4"){const target=g.order[(g.index+g.direction+g.order.length)%g.order.length];drawCards(g,target,card.value==="+2"?2:4);steps=2}next(g,steps);g.last=(r.players[uid]?.name||"玩家")+" 出了 "+label(card.value);return r})}catch(e){$("gameMsg").textContent="出牌失敗："+(e.code?e.code+"：":"")+(e.message||e);console.error(e)}}
$("create").onclick=create;$("join").onclick=join;$("start").onclick=start;
$("draw").onclick=async()=>{try{await runTransaction(roomRef(),r=>{const g=r?.game;if(!g||g.winner||g.order[g.index]!==uid)return;drawCards(g,uid,1);next(g);g.last=(r.players[uid]?.name||"玩家")+" 摸了一張牌";return r})}catch(e){$("gameMsg").textContent="摸牌失敗："+e.message}};
$("uno").onclick=async()=>{try{await runTransaction(roomRef(),r=>{const g=r?.game;if(!g||g.winner||g.hands[uid]?.length!==1)return;g.uno=g.uno||{};g.uno[uid]=true;g.last=(r.players[uid]?.name||"玩家")+" 喊 UNO！";return r})}catch(e){$("gameMsg").textContent="喊 UNO 失敗："+e.message}};
$("colorBox").querySelectorAll("button").forEach(b=>b.onclick=async()=>{const c=b.dataset.color;$("colorBox").classList.add("hidden");if(pending)await commit(pending,c);pending=null});
$("leave").onclick=async()=>{try{if(room&&uid)await runTransaction(roomRef(),r=>{if(!r||r.game)return r;delete r.players[uid];const ids=Object.keys(r.players||{});if(!ids.length)return null;if(r.host===uid)r.host=ids[0];return r});if(stop)stop();$("waiting").classList.add("hidden");$("game").classList.add("hidden");$("lobby").classList.remove("hidden");$("msg").textContent="";room=""}catch(e){err(e)}};
</script></body></html>
